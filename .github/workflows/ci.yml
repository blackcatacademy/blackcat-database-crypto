name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_DSN: "mysql:host=127.0.0.1;port=3306;dbname=test;charset=utf8mb4"
      DB_USER: "root"
      DB_PASSWORD: "root"
      BC_TEST_DSN: "mysql:host=127.0.0.1;port=3306;dbname=test;charset=utf8mb4"
      BC_TEST_DB_USER: "root"
      BC_TEST_DB_PASS: "root"
    steps:
      - uses: actions/checkout@v4

      - name: Checkout blackcat-database (packages source of truth)
        uses: actions/checkout@v4
        with:
          repository: blackcatacademy/blackcat-database
          path: blackcat-database
          ref: dev
          submodules: recursive
          token: ${{ secrets.BLACKCAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, dom, pdo, pdo_mysql, sodium
          coverage: none

      - name: Configure Composer GitHub token
        run: composer config -g github-oauth.github.com "${{ secrets.BLACKCAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate packages encryption maps (schema gate)
        run: php bin/db-crypto-plan --blackcat-db-root=blackcat-database --schema-source=packages

      - name: Static analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon

      - name: Tests
        run: vendor/bin/phpunit

      - name: Generate telemetry snapshot
        run: php bin/db-crypto-telemetry --blackcat-db-root=blackcat-database --out=telemetry/db-crypto-metrics.json

      - name: Stress smoke (transform-only)
        run: php bin/db-crypto-stress --blackcat-db-root=blackcat-database --iterations=20000 --out=telemetry/db-crypto-stress.json

      - name: Health report (monitoring-friendly)
        run: php bin/db-crypto-health --blackcat-db-root=blackcat-database --generate-keys=1 --max-contexts=25 --out=telemetry/db-crypto-health.json

      - name: Upload telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-crypto-metrics
          path: |
            telemetry/db-crypto-metrics.json
            telemetry/db-crypto-stress.json
            telemetry/db-crypto-health.json
