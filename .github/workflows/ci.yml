name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, dom, pdo, pdo_mysql, sodium
          coverage: none

      - name: Configure Composer GitHub token
        run: composer config -g github-oauth.github.com "${{ secrets.BLACKCAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}"

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Validate encryption plan (schema gate)
        run: php bin/db-crypto-plan --schema=config/schema.snapshot.json --manifest=tests/fixtures/manifest.json config/encryption.example.json

      - name: Static analysis
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon

      - name: Tests
        run: vendor/bin/phpunit

      - name: Generate telemetry snapshot
        run: php bin/db-crypto-telemetry config/encryption.example.json --out=telemetry/db-crypto-metrics.json

      - name: Upload telemetry artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-crypto-metrics
          path: telemetry/db-crypto-metrics.json
