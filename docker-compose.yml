services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.php
    working_dir: /workspace/blackcat-database-crypto
    volumes:
      - ..:/workspace
    environment:
      # DB integration tests (required for a few tests; see tests/*IntegrationTest.php)
      DB_DSN: "mysql:host=mysql;port=3306;dbname=test;charset=utf8mb4"
      DB_USER: "root"
      DB_PASSWORD: "root"
      BC_TEST_DSN: "mysql:host=mysql;port=3306;dbname=test;charset=utf8mb4"
      BC_TEST_DB_USER: "root"
      BC_TEST_DB_PASS: "root"

      # Ensure encryption-map source of truth is available when running in a monorepo checkout.
      BLACKCAT_DB_ROOT: "/workspace/blackcat-database"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3310:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -proot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

